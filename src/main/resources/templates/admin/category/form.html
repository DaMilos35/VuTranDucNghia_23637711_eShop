<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Danh mục')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4" style="max-width: 680px">
    <div class="mb-3">
        <a th:href="@{/admin/categories}" class="text-decoration-none text-muted small">
            <i class="bi bi-arrow-left me-1"></i> Quay lại danh sách danh mục
        </a>
    </div>

    <div class="form-card">
        <div class="d-flex align-items-center mb-4 pb-2 border-bottom">
            <div class="bg-primary-subtle text-primary p-2 rounded-3 me-3">
                <i class="bi bi-folder-plus fs-4" th:if="${category.id == null}"></i>
                <i class="bi bi-folder-check fs-4" th:if="${category.id != null}"></i>
            </div>
            <div>
                <h4 class="fw-bold text-dark mb-0" th:text="${category.id == null} ? 'Thêm danh mục mới' : 'Cập nhật danh mục'"></h4>
                <span class="text-muted small" th:if="${category.id != null}" th:text="'Mã danh mục: #' + ${category.id}"></span>
            </div>
        </div>

        <form th:action="@{/admin/categories/save}" th:object="${category}" method="post">
            <input type="hidden" th:field="*{id}">
            
            <div class="mb-3">
                <label class="form-label">Tên danh mục <span class="text-danger">*</span></label>
                <input class="form-control" th:field="*{name}" th:errorclass="is-invalid" placeholder="VD: Điện thoại, Laptop, Bàn phím...">
                <div class="invalid-feedback" th:errors="*{name}"></div>
                <div class="form-text text-muted small">Tên danh mục là duy nhất và tối đa 100 ký tự.</div>
            </div>

            <div class="mb-4">
                <label class="form-label">Mô tả danh mục</label>
                <textarea class="form-control" rows="3" th:field="*{description}" th:errorclass="is-invalid" placeholder="Mô tả thông tin chi tiết về danh mục này..."></textarea>
                <div class="invalid-feedback" th:errors="*{description}"></div>
            </div>

            <div class="d-flex gap-2 justify-content-end pt-3 border-top">
                <a class="btn btn-outline-secondary" th:href="@{/admin/categories}">
                    <i class="bi bi-x-circle me-1"></i> Huỷ bỏ
                </a>
                <button class="btn btn-primary px-4" type="submit">
                    <i class="bi bi-check-circle me-1"></i> Lưu danh mục
                </button>
            </div>
        </form>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
