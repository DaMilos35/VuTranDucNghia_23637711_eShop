<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Danh mục')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    
    <!-- Admin Header Banner -->
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 pb-3 border-bottom">
        <div>
            <div class="d-flex align-items-center gap-2 mb-1">
                <span class="badge bg-primary-subtle text-primary fw-bold text-uppercase small">Quản Trị</span>
                <span class="text-muted small">/</span>
                <span class="text-muted small">Danh mục</span>
            </div>
            <h3 class="fw-bold text-dark mb-0">
                <i class="bi bi-folder2-open text-primary me-2"></i>Quản lý danh mục sản phẩm
            </h3>
        </div>
        <div class="mt-3 mt-md-0 d-flex gap-2">
            <a class="btn btn-primary d-inline-flex align-items-center shadow-sm" th:href="@{/admin/categories/new}">
                <i class="bi bi-plus-circle me-2"></i> Thêm danh mục mới
            </a>
        </div>
    </div>

    <!-- Quick Stat Bar -->
    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="stat-card-promax">
                <div>
                    <div class="text-muted small fw-medium">Tổng số danh mục</div>
                    <div class="fs-4 fw-bold text-dark" th:text="${#lists.size(categories)}">0</div>
                </div>
                <div class="stat-icon bg-primary-subtle text-primary">
                    <i class="bi bi-folder-fill"></i>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="stat-card-promax">
                <div>
                    <div class="text-muted small fw-medium">Quyền hạn</div>
                    <div class="fs-5 fw-bold text-dark">SELLER / ADMIN</div>
                </div>
                <div class="stat-icon bg-success-subtle text-success">
                    <i class="bi bi-shield-lock-fill"></i>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="stat-card-promax">
                <div>
                    <div class="text-muted small fw-medium">Dữ liệu CSDL</div>
                    <div class="fs-5 fw-bold text-dark">MariaDB 12.2</div>
                </div>
                <div class="stat-icon bg-warning-subtle text-warning">
                    <i class="bi bi-database-fill"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- Table Card -->
    <div class="table-card">
        <div class="p-3 bg-white border-bottom d-flex justify-content-between align-items-center">
            <span class="fw-bold text-dark"><i class="bi bi-list-ul me-2 text-primary"></i>Danh sách danh mục hiện có</span>
            <span class="badge bg-light text-secondary border" th:text="${#lists.size(categories)} + ' danh mục'"></span>
        </div>
        <table class="table table-custom table-hover align-middle mb-0">
            <thead>
                <tr>
                    <th style="width: 80px" class="text-center">ID</th>
                    <th style="width: 260px">Tên danh mục</th>
                    <th>Mô tả chi tiết</th>
                    <th style="width: 180px" class="text-center">Thao tác</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="c : ${categories}">
                    <td class="text-center">
                        <span class="badge bg-light text-secondary border fw-bold" th:text="${c.id}"></span>
                    </td>
                    <td>
                        <strong class="text-dark d-flex align-items-center" th:text="${c.name}"></strong>
                    </td>
                    <td class="text-muted" th:text="${c.description != null and !c.description.isEmpty() ? c.description : '—'}"></td>
                    <td class="text-center text-nowrap">
                        <a class="btn btn-sm btn-outline-primary me-1"
                           th:href="@{/admin/categories/{id}/edit(id=${c.id})}">
                            <i class="bi bi-pencil me-1"></i>Sửa
                        </a>
                        <form th:action="@{/admin/categories/{id}/delete(id=${c.id})}"
                              method="post" class="d-inline"
                              onsubmit="return confirm('Bạn có chắc chắn muốn xoá danh mục này?')">
                            <button class="btn btn-sm btn-outline-danger">
                                <i class="bi bi-trash me-1"></i>Xoá
                            </button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(categories)}">
                    <td colspan="4" class="text-center py-5 text-muted">
                        <i class="bi bi-inbox fs-2 d-block mb-2 text-secondary opacity-50"></i>
                        Chưa có dữ liệu danh mục nào trong hệ thống
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
