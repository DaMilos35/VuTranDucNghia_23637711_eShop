<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Quản lý sản phẩm')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    
    <!-- Admin Header Banner -->
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 pb-3 border-bottom">
        <div>
            <div class="d-flex align-items-center gap-2 mb-1">
                <span class="badge bg-primary-subtle text-primary fw-bold text-uppercase small">Quản Trị</span>
                <span class="text-muted small">/</span>
                <span class="text-muted small">Sản phẩm</span>
            </div>
            <h3 class="fw-bold text-dark mb-0">
                <i class="bi bi-boxes text-primary me-2"></i>Quản lý kho sản phẩm
            </h3>
        </div>
        <div class="mt-3 mt-md-0">
            <a class="btn btn-primary d-inline-flex align-items-center shadow-sm" th:href="@{/admin/products/new}">
                <i class="bi bi-plus-circle me-2"></i> Thêm sản phẩm mới
            </a>
        </div>
    </div>

    <!-- Quick Stat Bar -->
    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="stat-card-promax">
                <div>
                    <div class="text-muted small fw-medium">Tổng sản phẩm tìm thấy</div>
                    <div class="fs-4 fw-bold text-dark" th:text="${products.totalElements}">0</div>
                </div>
                <div class="stat-icon bg-primary-subtle text-primary">
                    <i class="bi bi-box-seam-fill"></i>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="stat-card-promax">
                <div>
                    <div class="text-muted small fw-medium">Số trang hiển thị</div>
                    <div class="fs-4 fw-bold text-dark" th:text="${products.totalPages}">0</div>
                </div>
                <div class="stat-icon bg-info-subtle text-info">
                    <i class="bi bi-file-earmark-text-fill"></i>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="stat-card-promax">
                <div>
                    <div class="text-muted small fw-medium">Quy cách hiển thị</div>
                    <div class="fs-5 fw-bold text-dark">10 sản phẩm/trang</div>
                </div>
                <div class="stat-icon bg-success-subtle text-success">
                    <i class="bi bi-sliders"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- Filter toolbar -->
    <div class="bg-white p-3 rounded-3 border mb-4 shadow-sm">
        <form class="row g-2 align-items-center" th:action="@{/admin/products}" method="get">
            <div class="col-md-5">
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-search"></i></span>
                    <input class="form-control border-start-0" name="keyword" th:value="${keyword}" placeholder="Tìm theo tên sản phẩm...">
                </div>
            </div>
            <div class="col-md-4">
                <select class="form-select" name="categoryId">
                    <option value="">-- Tất cả danh mục --</option>
                    <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"
                            th:selected="${c.id == categoryId}"></option>
                </select>
            </div>
            <div class="col-md-3 d-flex gap-2">
                <button class="btn btn-primary flex-grow-1" type="submit">
                    <i class="bi bi-funnel me-1"></i> Lọc dữ liệu
                </button>
                <a th:if="${keyword != null or categoryId != null}" th:href="@{/admin/products}" class="btn btn-outline-secondary" title="Đặt lại bộ lọc">
                    <i class="bi bi-arrow-counterclockwise"></i>
                </a>
            </div>
        </form>
    </div>

    <!-- Products Table Card -->
    <div class="table-card">
        <table class="table table-custom table-hover align-middle mb-0">
            <thead>
                <tr>
                    <th style="width: 70px" class="text-center">ID</th>
                    <th style="width: 80px" class="text-center">Ảnh</th>
                    <th>Tên sản phẩm</th>
                    <th style="width: 170px">Danh mục</th>
                    <th class="text-end" style="width: 140px">Đơn giá</th>
                    <th class="text-center" style="width: 130px">Tồn kho</th>
                    <th class="text-center" style="width: 160px">Thao tác</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="p : ${products.content}">
                    <td class="text-center">
                        <span class="badge bg-light text-secondary border fw-bold" th:text="${p.id}"></span>
                    </td>
                    <td class="text-center">
                        <img class="thumb" th:src="${p.imageUrl}" alt=""
                             onerror="this.onerror=null; this.src='https://placehold.co/100x80?text=No+Img';">
                    </td>
                    <td>
                        <strong class="text-dark d-block" th:text="${p.name}"></strong>
                        <small class="text-muted text-truncate d-inline-block" style="max-width: 320px;" th:text="${p.description}"></small>
                    </td>
                    <td>
                        <span class="badge bg-primary-subtle text-primary fw-semibold" th:text="${p.category.name}"></span>
                    </td>
                    <td class="text-end price fw-bold" th:text="${#numbers.formatDecimal(p.price, 0, 'POINT', 0, 'COMMA')} + ' ₫'"></td>
                    <td class="text-center">
                        <span th:if="${p.quantity > 5}" class="badge-stock badge-in-stock" th:text="${p.quantity} + ' sp'"></span>
                        <span th:if="${p.quantity > 0 and p.quantity <= 5}" class="badge-stock badge-low-stock" th:text="'Còn ' + ${p.quantity}"></span>
                        <span th:if="${p.quantity == 0}" class="badge-stock badge-out-stock">Hết hàng</span>
                    </td>
                    <td class="text-center text-nowrap">
                        <a class="btn btn-sm btn-outline-primary me-1"
                           th:href="@{/admin/products/{id}/edit(id=${p.id})}">
                            <i class="bi bi-pencil me-1"></i>Sửa
                        </a>
                        <form th:action="@{/admin/products/{id}/delete(id=${p.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('Bạn có chắc muốn xoá sản phẩm này?')">
                            <button class="btn btn-sm btn-outline-danger">
                                <i class="bi bi-trash me-1"></i>Xoá
                            </button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${products.empty}">
                    <td colspan="7" class="text-center py-5 text-muted">
                        <i class="bi bi-box2 fs-2 d-block mb-2 text-secondary opacity-50"></i>
                        Không có sản phẩm nào phù hợp với điều kiện tìm kiếm
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Pagination -->
    <nav class="mt-4" th:if="${products.totalPages > 1}">
        <ul class="pagination justify-content-center flex-wrap">
            <li class="page-item" th:classappend="${products.first} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/admin/products(keyword=${keyword}, categoryId=${categoryId}, page=${products.number - 1})}">
                    <i class="bi bi-chevron-left"></i>
                </a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, products.totalPages - 1)}"
                th:classappend="${i == products.number} ? 'active'">
                <a class="page-link"
                   th:href="@{/admin/products(keyword=${keyword}, categoryId=${categoryId}, page=${i})}"
                   th:text="${i + 1}"></a>
            </li>
            <li class="page-item" th:classappend="${products.last} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/admin/products(keyword=${keyword}, categoryId=${categoryId}, page=${products.number + 1})}">
                    <i class="bi bi-chevron-right"></i>
                </a>
            </li>
        </ul>
    </nav>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
