<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sản phẩm')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4" style="max-width: 780px">
    <div class="mb-3">
        <a th:href="@{/admin/products}" class="text-decoration-none text-muted small">
            <i class="bi bi-arrow-left me-1"></i> Quay lại danh sách sản phẩm
        </a>
    </div>

    <div class="form-card">
        <div class="d-flex align-items-center mb-4 pb-2 border-bottom">
            <div class="bg-primary-subtle text-primary p-2 rounded-3 me-3">
                <i class="bi bi-box-seam fs-4" th:if="${product.id == null}"></i>
                <i class="bi bi-pencil-square fs-4" th:if="${product.id != null}"></i>
            </div>
            <div>
                <h4 class="fw-bold text-dark mb-0" th:text="${product.id == null} ? 'Thêm sản phẩm mới' : 'Cập nhật thông tin sản phẩm'"></h4>
                <span class="text-muted small" th:if="${product.id != null}" th:text="'Mã sản phẩm: #' + ${product.id}"></span>
            </div>
        </div>

        <form th:action="@{/admin/products/save}" th:object="${product}" method="post">
            <input type="hidden" th:field="*{id}">
            
            <div class="mb-3">
                <label class="form-label">Tên sản phẩm <span class="text-danger">*</span></label>
                <input class="form-control" th:field="*{name}" th:errorclass="is-invalid" placeholder="VD: iPhone 15 Pro Max 256GB">
                <div class="invalid-feedback" th:errors="*{name}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Danh mục sản phẩm <span class="text-danger">*</span></label>
                <select class="form-select" name="categoryId"
                        th:classappend="${categoryError} ? 'is-invalid'">
                    <option value="">-- Vui lòng chọn danh mục --</option>
                    <option th:each="c : ${categories}" th:value="${c.id}"
                            th:text="${c.name}"
                            th:selected="${c.id == selectedCategoryId}"></option>
                </select>
                <div class="invalid-feedback" th:text="${categoryError}"></div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label">Giá bán (₫) <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <input type="number" step="1000" min="0" class="form-control"
                               th:field="*{price}" th:errorclass="is-invalid" placeholder="0">
                        <span class="input-group-text bg-light text-muted">₫</span>
                        <div class="invalid-feedback" th:errors="*{price}"></div>
                    </div>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Số lượng tồn kho <span class="text-danger">*</span></label>
                    <input type="number" min="0" class="form-control"
                           th:field="*{quantity}" th:errorclass="is-invalid" placeholder="0">
                    <div class="invalid-feedback" th:errors="*{quantity}"></div>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Đường dẫn hình ảnh (URL)</label>
                <input class="form-control" th:field="*{imageUrl}"
                       placeholder="https://... hoặc /images/products/example.jpg">
                <div class="form-text text-muted small">URL trực tiếp tới ảnh sản phẩm hoặc ảnh mẫu placeholder.</div>
                
                <div th:if="*{imageUrl}" class="mt-2 p-2 bg-light rounded border d-inline-block">
                    <span class="d-block small text-muted mb-1">Xem trước ảnh:</span>
                    <img th:src="*{imageUrl}" class="rounded border" style="max-height: 120px; max-width: 200px; object-fit: contain;" alt="Xem trước"
                         onerror="this.onerror=null; this.src='https://placehold.co/200x120?text=Loi+Anh';">
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label">Mô tả sản phẩm</label>
                <textarea class="form-control" rows="3" th:field="*{description}"
                          th:errorclass="is-invalid" placeholder="Nhập tóm tắt tính năng, cấu hình hoặc đặc điểm nổi bật..."></textarea>
                <div class="invalid-feedback" th:errors="*{description}"></div>
            </div>

            <div class="d-flex gap-2 justify-content-end pt-3 border-top">
                <a class="btn btn-outline-secondary" th:href="@{/admin/products}">
                    <i class="bi bi-x-circle me-1"></i> Huỷ bỏ
                </a>
                <button class="btn btn-primary px-4" type="submit">
                    <i class="bi bi-check-circle me-1"></i> Lưu sản phẩm
                </button>
            </div>
        </form>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
