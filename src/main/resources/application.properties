spring.application.name=VuTranDucNghia_23637711_eShop
server.port=8080

# ===== MariaDB Database Configuration =====
spring.datasource.url=jdbc:mariadb://localhost:3306/eshop
spring.datasource.username=root
spring.datasource.password=12345678
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ===== JPA / Hibernate Configuration =====
# Database tables are initialized via database/eShop.sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Enable Open Session In View for Lazy Loading in Thymeleaf views
spring.jpa.open-in-view=true

# ===== Thymeleaf Configuration =====
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML
